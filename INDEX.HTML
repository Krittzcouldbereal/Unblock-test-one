<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About:Blank Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>About:Blank HTML Launcher</h1>

    <textarea id="htmlInput" placeholder="Paste your HTML here..."></textarea>

    <div class="buttons">
      <button id="openBtn">Open in about:blank</button>
      <button id="saveBtn">Save HTML</button>
      <input type="file" id="fileInput" accept=".html,.htm" />
    </div>

    <h2>Saved Pages</h2>
    <div id="savedList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
